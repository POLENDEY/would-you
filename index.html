<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Question...</title>
    <style>
        body {
            background: linear-gradient(135deg, #fff5f8 0%, #ffe3ec 100%);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(216, 27, 96, 0.15);
            text-align: center;
            max-width: 420px;
            width: 90%;
            border: 1px solid #ffdae9;
            transition: all 0.5s ease;
        }

        .icon {
            font-size: 60px;
            margin-bottom: 10px;
        }

        h1 {
            color: #d81b60;
            font-size: 28px;
            margin-bottom: 15px;
        }

        p.pitch {
            color: #666;
            font-size: 18px;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .details-box {
            display: none; /* Hidden until Yes is clicked */
            margin-top: 20px;
            padding: 20px;
            background: #fff0f3;
            border-radius: 15px;
            text-align: left;
            border-left: 5px solid #ff4d6d;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .details-box div {
            margin-bottom: 10px;
            color: #444;
        }

        .details-box strong {
            color: #d81b60;
            display: inline-block;
            width: 100px;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn {
            background-color: #ff4d6d;
            color: white;
            border: none;
            padding: 15px 35px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.3);
        }

        .btn:hover {
            background-color: #c9184a;
            transform: translateY(-3px);
        }

        #no-btn {
            background-color: #f8f9fa;
            color: #888;
            box-shadow: none;
        }

        .success-msg {
            display: none;
            color: #38b000;
            font-size: 22px;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="card" id="main-card">
        <div class="icon">✨</div>
        <h1 id="title">I have a question...</h1>
        <p class="pitch" id="pitch-text">
            Life is better when there's a sunset, a cold drink, and someone amazing to share it with. Will you be my date?
        </p>
        
        <div class="btn-container" id="controls">
            <button class="btn" onclick="acceptInvitation()">Yes!</button>
            <button class="btn" id="no-btn" onmouseover="moveNo()">No</button>
        </div>

        <div id="details" class="details-box">
            <div class="success-msg" id="msg">It's a date! See you there. 🥂</div>
            <hr style="border: 0; border-top: 1px solid #ffdae9; margin: 15px 0;">
            <div><strong>When:</strong> Feb 17, 4:00 PM</div>
            <div><strong>Where:</strong> Bayleaf Intramuros, Sky Deck</div>
            <div><strong>Dress Code:</strong> Smart Casual Attire</div>
        </div>
    </div>

    <script>
        function acceptInvitation() {
            // Hide the question and buttons
            document.getElementById('pitch-text').style.display = 'none';
            document.getElementById('controls').style.display = 'none';
            document.getElementById('title').innerText = "Perfect. ❤️";
            
            // Show the details
            document.getElementById('details').style.display = 'block';
            document.getElementById('msg').style.display = 'block';
        }

        // Fun feature: The "No" button moves when hovered
        function moveNo() {
            const btn = document.getElementById('no-btn');
            const x = Math.random() * (window.innerWidth - btn.offsetWidth) - (window.innerWidth/2);
            const y = Math.random() * (window.innerHeight - btn.offsetHeight) - (window.innerHeight/2);
            btn.style.transform = `translate(${x/2}px, ${y/2}px)`;
        }
    </script>

</body>
</html>
